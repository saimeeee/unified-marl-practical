schema_version: 1
application: warehouse
backend: inventory
algorithm: mfvfd
seed: 11
device: cpu
execution: local
env_args:
  agents_file: ../assets/warehouse/agents.csv
  demand_file: ../assets/warehouse/demand.csv
  horizon: 24
  backlog: false
  reward_scale: 1000.0
training:
  t_max: 100000
  max_updates: 1000
  batch_size: 32
  buffer_size: 5000
  num_threads: 1
  num_groups: 2
  n_heads: 2
  embed_dim: 64
  hidden_dim: 64
  hmf_steps_per_update: 1
  hmf_num_batch: 1
  hmf_norm_rewards: false
  hmf_noise_decay: 0.0012
output: {}
