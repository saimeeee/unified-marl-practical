# --- COMA specific parameters ---

action_selector: "multinomial"
epsilon_start: .5
epsilon_finish: .05
epsilon_anneal_time: 500000
mask_before_softmax: False

runner: "parallel"

buffer_size: 32
off_buffer_size: 70000 # size of the off-policy buffer default: 5000
batch_size_run: 10 # 10 num of parellel envs
batch_size: 16
off_batch_size: 32  # batch_size_train
e2e: False

env_args:
  state_last_action: True # critic adds last action internally

# update the target network every {} training steps
target_update_interval: 600
step: 5 #steps for tree back up diagram  (adjustable based on # of agents)

pi_accuracy: 0.5
lr: 0.0005
critic_lr: 0.0001
td_lambda: 0.8
icq_alpha: 1
icq_beta: 100

# use qmix
mixing_embed_dim: 32

# use COMA
agent_output_type: "pi_logits"
learner: "offpg_learner"
# learner: "offpg_continuous_learner"
q_nstep: 0  # 0 corresponds to default Q, 1 is r + gamma*Q, etc

name: "ICQ-MA"

offline_dataset_dir: "/home/limingyang/kouqian_code/MAOfflineDatasets/SMAC410_balanced_pref/8m/good_200episode_final/100_120labeled.th" # 10m 
offline_dataset_quality: good_200episode_final # 10m 
map_name: "3m" # 10m
max_traj_length: 60 # 10m
reward_dir: "/share/project/kouqian/Codes/MARLHF/MADiversePreferDatasets/3m/reward.th"
use_pref: False

# for reward model learning & ICQ with reward_hat
pref_segment_pairs: 100
train_reward: False
train_predicter: False
model_type: "MultiPrefTransformerDivide"
action_type: "Discrete"
reward_train_epoch: 100
reward_batch_size: 32
use_reward_hat: False

# for diverse preference learning
train_diverse_predictor: True
diverse_dataset_dir: "/share/project/kouqian/Codes/MARLHF/MADiversePreferDatasets/3m/3m.th"

