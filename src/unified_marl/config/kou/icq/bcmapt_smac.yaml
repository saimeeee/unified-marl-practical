# --- BC specific parameters ---

# use multinomial selector
action_selector: "multinomial"
epsilon_start: .5
epsilon_finish: .05
epsilon_anneal_time: 500000

runner: "parallel"

buffer_size: 32
off_buffer_size: 70000 # size of the off-policy buffer default: 5000
batch_size_run: 10 # 10 num of parellel envs
batch_size: 16
off_batch_size: 32  # batch_size_train

env_args:
  state_last_action: True # critic adds last action internally
# 是否端到端
e2e: False

# use the BC_Learner to train
agent_output_type: "pi_logits"
learner: "bcmapt_learner"
lr: 0.0005
lamda: 1
T: 0.5
mask_before_softmax: False

name: "BCMAPT"

offline_dataset_dir: "/home/limingyang/kouqian_code/MAOfflineDatasets/SMAC410_imbalanced_pref/10m_vs_11m/low_1000episode_policypool_new/500_150labeled.th" # 10m 
offline_dataset_quality: low_1000episode_policypool_new # 10m 
map_name: "10m_vs_11m" # 10m
max_traj_length: 150 # 10m
reward_dir: /home/limingyang/kouqian_code/MAOfflineDatasets/SMAC410_imbalanced_pref/10m_vs_11m/low_1000episode_policypool_new/500_150labeled_MultiPrefTransformerDivide_testrm_agent_reward.th # 10m
pref_segment_pairs: 500
use_pref: True


train_reward: False
model_type: "MultiPrefTransformerDivide"
action_type: "Discrete"
reward_train_epoch: 100
reward_batch_size: 128
use_reward_hat: False
train_predicter: False