# --- COMA specific parameters ---

action_selector: "multinomial"
epsilon_start: .5
epsilon_finish: .05
epsilon_anneal_time: 500000
mask_before_softmax: False

runner: "parallel"

buffer_size: 32
off_buffer_size: 70000 # size of the off-policy buffer default: 5000
batch_size_run: 10 # 10 num of parellel envs
batch_size: 16
off_batch_size: 32  # batch_size_train
e2e: False
env_args:
  state_last_action: True # critic adds last action internally


lr: 0.0005
dppo_alpha: 100
dppo_lambda: 0.5

# use qmix
mixing_embed_dim: 32

# use COMA
agent_output_type: "pi_logits"
learner: "dppo_learner"
q_nstep: 0  # 0 corresponds to default Q, 1 is r + gamma*Q, etc

name: "DPPO"

offline_dataset_dir: "/home/limingyang/kouqian_code/MAOfflineDatasets/SMAC410_imbalanced_pref/10m_vs_11m/low_1000episode_policypool_discrete/500_150labeled.th" # 10m 
offline_dataset_quality: low_1000episode_policypool_discrete # 10m 
map_name: "10m_vs_11m" # 10m
max_traj_length: 150 # 10m
reward_dir: /home/limingyang/kouqian_code/MAOfflineDatasets/SMAC410_imbalanced_pref/10m_vs_11m/low_6-4_1000episode_policypool/500_150labeled_MultiPrefTransformerDivide_agent_reward.th # 10m
use_pref: True

pref_segment_pairs: 500
train_reward: False
max_traj_length: 30
model_type: "MR"
action_type: "Discrete"
reward_train_epoch: 100
reward_batch_size: 128
use_reward_hat: False
train_predicter: False